[package]
name = "wissel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Pick a browser every time you open a link"
repository = "https://github.com/x7c1/wissel"

[dependencies]
gio = "0.22.10"
gio-unix = "0.22.8"
gtk4 = { version = "0.11", features = ["v4_2"] }
libadwaita = { version = "0.9", features = ["v1_4"] }

[package.metadata.deb]
maintainer = "aida.t <994424+x7c1@users.noreply.github.com>"
section = "web"
priority = "optional"
depends = "$auto"
extended-description = """\
wissel registers as the default web browser. When an application opens a \
link, it shows the browsers installed on the system and launches the one \
picked, with a single key. Installed browsers are discovered from their \
desktop entries, so there is nothing to configure."""
# Asset sources are relative to this crate, except target/ paths, which
# cargo-deb resolves against the workspace target directory.
assets = [
    ["target/release/wissel", "usr/bin/", "755"],
    ["../../data/io.github.x7c1.wissel.desktop", "usr/share/applications/", "644"],
]
