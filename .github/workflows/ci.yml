name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    # Ubuntu 26.04 is the oldest release wissel supports, so it is also the
    # one everything is built and tested on.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The gate is defined once, in the Makefile, so CI and a local run
      # cannot drift apart.
      - name: Check
        run: make check

  # Build the Debian package on every change, so a broken package is caught
  # before a release depends on it. The file is uploaded as a workflow
  # artifact for reviewers to download and try.
  deb:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deb-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deb-

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build the package
        run: cargo deb --locked -p wissel

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: wissel-deb
          path: target/debian/wissel_*.deb
          if-no-files-found: error
